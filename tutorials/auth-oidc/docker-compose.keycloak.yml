services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    ports:
      - "8280:8280"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "keycloak"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8280"
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
    volumes:
      - ./keycloak/kannika-realm.json:/opt/keycloak/data/import/kannika-realm.json:ro
    networks:
      - keycloak

networks:
  keycloak:
    driver: bridge
    name: keycloak
