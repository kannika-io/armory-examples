services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    ports:
      - "8280:8280"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "keycloak"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8280"
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
    volumes:
      - ./keycloak/kannika-realm.json:/opt/keycloak/data/import/kannika-realm.json:ro
    networks:
      - keycloak

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: oauth2-proxy
    ports:
      - "4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Keycloak
      OAUTH2_PROXY_CLIENT_ID: kannika-armory-proxy
      OAUTH2_PROXY_CLIENT_SECRET: kannika-armory-proxy-secret
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8280/realms/kannika
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://host.docker.internal:8080/
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SCOPE: openid profile email
      OAUTH2_PROXY_COOKIE_SECRET: b2F1dGgycHJveHktY29va2llLXNlY3JldC10dSEhISE=
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
    networks:
      - keycloak

networks:
  keycloak:
    driver: bridge
    name: keycloak
